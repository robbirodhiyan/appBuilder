name: Debiyan Android Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full source & tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository, branch and EAS identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('project.config.json', 'utf8'));
          const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== process.env.DEFAULT_BRANCH) throw new Error('Release must run on default branch');
          const configured = `${p.release.owner}/${p.release.repository}`;
          if (configured.toLowerCase() !== process.env.GITHUB_REPOSITORY.toLowerCase()) throw new Error('GitHub repository mismatch: configure release.owner/repository');
          if (!a.expo.extra?.eas?.projectId) throw new Error('Missing EAS Project ID: run eas init, commit changes');
          NODE

      - name: Increment app version automatically
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/ci/bump-version.mjs "$BUMP"

      - name: Validate DeyKit project
        run: npm run validate:release

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Download release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_PREFIX: ${{ steps.version.outputs.prefix }}
        run: node scripts/ci/download-apk.mjs

      - name: Commit synchronized version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_PREFIX: ${{ steps.version.outputs.prefix }}
          APP_NAME: ${{ steps.version.outputs.app_name }}
        run: |
          gh release create "v$VERSION" \
            "dist/$APK_PREFIX-v$VERSION.apk" \
            --title "$APP_NAME v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes
